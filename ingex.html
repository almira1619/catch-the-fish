<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Catch the Fish</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<!-- ========================= -->
<!-- START SCREEN -->
<!-- ========================= -->

<div id="menu">

<button id="playBtn">
PLAY
</button>

</div>

<!-- ========================= -->
<!-- GAME -->
<!-- ========================= -->

<div id="game">

<img
id="background"
src="assets/images/background.png">

<div id="topBar">

<div id="instruction">

Catch the GREEN fish!

</div>

<div id="score">

⭐ <span id="points">0</span>/5

</div>

</div>

<!-- ========================= -->
<!-- FISHES -->
<!-- ========================= -->

<div class="fish green">

<img src="assets/images/green.png">

</div>

<div class="fish red">

<img src="assets/images/red.png">

</div>

<div class="fish blue">

<img src="assets/images/blue.png">

</div>

<div class="fish yellow">

<img src="assets/images/yellow.png">

</div>

<div class="fish orange">

<img src="assets/images/orange.png">

</div>

<!-- ========================= -->
<!-- NET -->
<!-- ========================= -->

<img
id="net"
src="assets/images/net.png">

</div>

<!-- ========================= -->
<!-- WIN -->
<!-- ========================= -->

<div id="winScreen">

<h1>

🌟 Great Job! 🌟

</h1>

<button id="againBtn">

Play Again

</button>

</div>

<script src="script.js"></script>

</body>

</html>
